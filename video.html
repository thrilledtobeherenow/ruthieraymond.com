<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video</title>
    <link rel="stylesheet" href="style.css">
</head>

<body class="video-page">

    <main class="single-video-page">

        <iframe
            id="external-video"
            class="single-video"
            src=""
            title="Video player"
            allow="autoplay; fullscreen; picture-in-picture"
            allowfullscreen>
        </iframe>

        <p id="video-title"></p>

    </main>

    <script>
        const videos = {
            1: {
                title: "Placeholder Name 1",
                url: ""
            },
            2: {
                title: "Placeholder Name 2",
                url: ""
            },
            3: {
                title: "Placeholder Name 3",
                url: ""
            },
            4: {
                title: "Placeholder Name 4",
                url: ""
            },
            5: {
                title: "Placeholder Name 5",
                url: ""
            },
            6: {
                title: "Placeholder Name 6",
                url: ""
            },
            7: {
                title: "Placeholder Name 7",
                url: ""
            },
            8: {
                title: "Placeholder Name 8",
                url: ""
            }
        };

        const number = new URLSearchParams(window.location.search).get("video");
        const selectedVideo = videos[number];

        if (selectedVideo) {
            document.title = selectedVideo.title;
            document.getElementById("video-title").textContent = selectedVideo.title;

            if (selectedVideo.url) {
                document.getElementById("external-video").src = selectedVideo.url;
            } else {
                document.getElementById("external-video").style.display = "none";
                document.getElementById("video-title").textContent =
                    selectedVideo.title + " — external video link not added yet.";
            }
        }
    </script>

</body>
</html>
